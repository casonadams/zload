name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh git man-db
          curl -fsSL https://git.io/shellspec | sudo sh -s -- --yes -p /usr/local

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zsh git shellspec || true

      - name: Run ShellSpec BDD suite
        run: shellspec

      - name: Run test suite
        run: zsh test/run_all.zsh

      - name: Run benchmarks
        run: zsh benchmark/bench.zsh

      - name: Run final specification verification
        run: zsh test/verify_all.zsh
