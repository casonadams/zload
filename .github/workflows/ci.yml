name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh git

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zsh git || true

      - name: Run test suite
        run: zsh test/run_all.zsh

      - name: Run benchmarks
        run: zsh benchmark/bench.zsh
